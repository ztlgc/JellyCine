plugins {
    id 'com.android.compose.screenshot' version '0.0.1-alpha16' apply false
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.library' version '9.4.1' apply false
    id 'com.android.kotlin.multiplatform.library' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.20' apply false
    id 'com.google.dagger.hilt.android' version '2.60.1' apply false
    id 'com.google.devtools.ksp' version '2.3.12' apply false
}

ext {
    // 版本格式为 major.minor.patch.revision，其中第四段为定制修订号。
    // versionCode = major*1000000 + minor*10000 + patch*100 + revision，保证随版本号单调递增。
    appVersionName = "1.3.6.3"
    appVersionCode = 1 * 1000000 + 3 * 10000 + 6 * 100 + 3
}
