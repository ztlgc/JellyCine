plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

configurations {
    mpvBaseArchive {
        canBeConsumed = false
        transitive = false
    }
}

// Keep the original decoder/player binaries and replace only the matching audio-filter library.
// A local repack avoids mutating Maven/Gradle caches or checking a complete AAR into source control.
def mpvAudioDirectory = file('native/mpv-audio-dsp')
def prepareMpvAudioDsp = tasks.register('prepareMpvAudioDsp', Zip) {
    archiveFileName.set('libmpv-1.0.4-jellycine-audio.aar')
    destinationDirectory.set(layout.buildDirectory.dir('generated/mpv-audio-dsp'))
    from({ zipTree(configurations.mpvBaseArchive.singleFile) }) {
        exclude 'jni/**/libavfilter.so'
    }
    from(new File(mpvAudioDirectory, 'jni')) { into 'jni' }
    from(new File(mpvAudioDirectory, 'COPYING.GPLv3')) { into 'assets/jellycine-audio-dsp' }
    from(new File(mpvAudioDirectory, 'README.md')) { into 'assets/jellycine-audio-dsp' }
    from(new File(mpvAudioDirectory, 'manifest.json')) { into 'assets/jellycine-audio-dsp' }
    inputs.files(configurations.mpvBaseArchive)
    inputs.file(new File(mpvAudioDirectory, 'manifest.json'))
    inputs.file(new File(mpvAudioDirectory, 'mpv_audio_bridge.cpp'))
    inputs.file(new File(mpvAudioDirectory, 'build.py'))
    inputs.dir(new File(mpvAudioDirectory, 'jni'))
    doFirst {
        def manifest = new groovy.json.JsonSlurper().parse(new File(mpvAudioDirectory, 'manifest.json'))
        def digest = { File path ->
            path.withInputStream { stream ->
                def md = java.security.MessageDigest.getInstance('SHA-256')
                byte[] buffer = new byte[65536]
                int count
                while ((count = stream.read(buffer)) != -1) md.update(buffer, 0, count)
                md.digest().encodeHex().toString()
            }
        }
        if (digest(configurations.mpvBaseArchive.singleFile) != manifest.base_aar_sha256) {
            throw new GradleException('MPV base dependency changed. Rebuild and verify the audio DSP libraries first.')
        }
        if (digest(new File(mpvAudioDirectory, 'mpv_audio_bridge.cpp')) != manifest.bridge_source_sha256 ||
            digest(new File(mpvAudioDirectory, 'build.py')) != manifest.build_script_sha256) {
            throw new GradleException('MPV audio DSP build sources changed. Rebuild the native libraries and manifest first.')
        }
        ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
            ['libavfilter.so', 'libjellycine_mpv_audio.so'].each { name ->
                def binary = new File(mpvAudioDirectory, "jni/${abi}/${name}")
                def expected = manifest.jni[abi]?.get(name)
                if (!binary.isFile() || expected == null || digest(binary) != expected.sha256) {
                    throw new GradleException("Missing or changed MPV audio DSP binary: ${abi}/${name}. Run phone/native/mpv-audio-dsp/build.py.")
                }
            }
        }
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingValue = { String key, String envKey ->
    def prop = keystoreProperties.getProperty(key)
    if (prop != null && !prop.trim().isEmpty()) return prop.trim()
    def env = System.getenv(envKey)
    return (env != null && !env.trim().isEmpty()) ? env.trim() : null
}

def watchSyncProperties = new Properties()
def watchSyncFile = rootProject.file('supabase.local.properties')
if (watchSyncFile.isFile()) watchSyncFile.withInputStream { watchSyncProperties.load(it) }
def watchSyncLiteral = { String name ->
    groovy.json.JsonOutput.toJson(watchSyncProperties.getProperty(name, '').trim())
}
def watchSyncKey = watchSyncProperties.getProperty('SUPABASE_PUBLISHABLE_KEY', '').trim()
if (watchSyncKey && !watchSyncKey.startsWith('sb_publishable_')) {
    throw new GradleException('SUPABASE_PUBLISHABLE_KEY must be a publishable key. Secret and legacy service_role keys must never enter the APK.')
}

android {
    namespace = 'com.jellycine.app'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.jellycine.app"
        minSdk = 27
        targetSdk = 36
        versionCode = rootProject.ext.appVersionCode as Integer
        versionName = rootProject.ext.appVersionName as String
        buildConfigField 'String', 'SUPABASE_URL', watchSyncLiteral('SUPABASE_URL')
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', watchSyncLiteral('SUPABASE_PUBLISHABLE_KEY')

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            def storeFilePath = signingValue("storeFile", "JELLYCINE_STORE_FILE") ?: "jellycine-release.keystore"
            def storePasswordValue = signingValue("storePassword", "JELLYCINE_STORE_PASSWORD")
            def keyAliasValue = signingValue("keyAlias", "JELLYCINE_KEY_ALIAS")
            def keyPasswordValue = signingValue("keyPassword", "JELLYCINE_KEY_PASSWORD")

            if (storePasswordValue != null && keyAliasValue != null && keyPasswordValue != null) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    splits {
        abi {
            def isBuildingBundle = gradle.startParameter.taskNames.any {
                it.toLowerCase(Locale.ROOT).contains("bundle")
            }
            enable = !isBuildingBundle

            reset()
            include(*providers.gradleProperty('androidAbis').getOrElse('armeabi-v7a,arm64-v8a,x86,x86_64').split(','))
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
            systemProperty 'sun.net.client.defaultReadTimeout', '30000'
        }
    }
    
    packagingOptions {
        jniLibs {
            // These binaries are already stripped and checksummed by the native build.
            keepDebugSymbols += ['**/libavfilter.so', '**/libjellycine_mpv_audio.so']
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def buildTypeName = variant.buildType
            def versionName = rootProject.ext.appVersionName as String
            def abiName = output.filters.find { it.filterType.toString() == "ABI" }?.identifier
            def abiSuffix = abiName != null ? "-${abiName}" : ""
            output.outputFileName.set("jellycine-phone-${buildTypeName}-${versionName}${abiSuffix}.apk")
        }
    }
}

// Fail before compiling release code when local signing configuration is incomplete.
def checkReleaseSigningConfiguration = tasks.register('checkReleaseSigningConfiguration') {
    doLast {
        def releaseSigning = android.signingConfigs.release
        if (releaseSigning.storeFile == null ||
            releaseSigning.storePassword == null ||
            releaseSigning.keyAlias == null ||
            releaseSigning.keyPassword == null) {
            throw new GradleException('Release signing is not configured. Set storeFile, storePassword, keyAlias and keyPassword in root keystore.properties, or the corresponding JELLYCINE_* environment variables. See docs/ANDROID_BUILD.md.')
        }
        if (!releaseSigning.storeFile.isFile()) {
            throw new GradleException('Release keystore file does not exist: ' + releaseSigning.storeFile + '. Paths in keystore.properties are relative to phone/.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(checkReleaseSigningConfiguration)
}

