// Host-side previews are opt-in and never enter the installed APK.
if (providers.gradleProperty('playbackScreenshot').isPresent()) {
    android.sourceSets.debug.res.srcDir('src/screenshotTest/res')
    android.experimentalProperties['android.experimental.enableScreenshotTest'] = true
    apply plugin: 'com.android.compose.screenshot'
    dependencies.add('screenshotTestImplementation', 'com.android.tools.screenshot:screenshot-validation-api:0.0.1-alpha16')
    dependencies.add('screenshotTestImplementation', dependencies.platform('androidx.compose:compose-bom:2026.09.00'))
    dependencies.add('screenshotTestImplementation', 'androidx.compose.ui:ui-tooling')
}
